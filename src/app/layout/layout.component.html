<div class="app-shell">
  <header class="topbar">
    <button type="button" class="logo" aria-label="Voltar para o início" (click)="goHome()">
      <span class="logo-mark"><svg class="cactus" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9.2" y="2" width="5.6" height="20" rx="2.8"/><rect x="3.6" y="8" width="3" height="8" rx="1.5"/><rect x="3.6" y="13" width="7" height="3" rx="1.5"/><rect x="17.4" y="5.5" width="3" height="8.5" rx="1.5"/><rect x="13.4" y="11" width="7" height="3" rx="1.5"/></svg></span>
      <strong>CactourShoes<span>.</span></strong>
    </button>

    <nav class="top-nav">
      <button *ngIf="auth.isLoggedIn" [class.active]="active === 'overview'" (click)="goHome()">Menu Principal</button>
      <ng-container *ngIf="auth.isLoggedIn">
        <button [class.active]="active === 'wardrobe'" (click)="go('wardrobe')">Meu guarda-roupa</button>
        <button [class.active]="active === 'compare'" (click)="go('compare')">Comparar produtos</button>
        <button [class.active]="active === 'size'" (click)="go('size')">Tamanho ideal</button>
        <button [class.active]="active === 'radar'" (click)="go('radar')">Radar de preço</button>
        <button [class.active]="active === 'durability'" (click)="go('durability')">Durabilidade</button>
      </ng-container>
    </nav>

    <button class="mobile-menu" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Abrir menu">{{ menuOpen ? '✕' : '☰' }}</button>

    <div class="topbar-actions">
      <div class="search-bar" *ngIf="auth.isLoggedIn">
        <input type="search" [(ngModel)]="searchTerm" placeholder="Buscar tênis, botas, marcas..." aria-label="Buscar" (keyup.enter)="search()" />
        <button type="button" class="search-submit" (click)="search()" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <div class="top-actions">
        <button class="login" *ngIf="!auth.isLoggedIn" (click)="goLogin()">Entrar</button>
        <div class="nav-dropdown account-dropdown" *ngIf="auth.isLoggedIn">
          <button type="button" class="account-trigger" aria-haspopup="true">
            <strong>{{ auth.initial }}</strong>
            {{ auth.firstName }}
            <svg class="chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="dropdown-panel">
            <button (click)="go('profile')">Perfil</button>
            <button (click)="logout()">Sair</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="mobile-nav-overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>
  <div class="mobile-nav" *ngIf="menuOpen">
    <div class="mobile-account" *ngIf="auth.isLoggedIn">
      <strong>{{ auth.initial }}</strong>
      {{ auth.firstName }}
    </div>

    <ng-container *ngIf="auth.isLoggedIn">
      <button class="mobile-nav-item" [class.active]="active === 'overview'" (click)="goHome()">Menu Principal</button>
      <button class="mobile-nav-item" [class.active]="active === 'wardrobe'" (click)="go('wardrobe')">Meu guarda-roupa</button>
      <button class="mobile-nav-item" [class.active]="active === 'compare'" (click)="go('compare')">Comparar produtos</button>
      <button class="mobile-nav-item" [class.active]="active === 'size'" (click)="go('size')">Tamanho ideal</button>
      <button class="mobile-nav-item" [class.active]="active === 'radar'" (click)="go('radar')">Radar de preço</button>
      <button class="mobile-nav-item" [class.active]="active === 'durability'" (click)="go('durability')">Durabilidade</button>
    </ng-container>

    <ng-container *ngIf="auth.isLoggedIn">
      <div class="mobile-nav-divider"></div>
      <button class="mobile-nav-item" (click)="go('profile')">Perfil</button>
      <button class="mobile-nav-item" (click)="logout()">Sair</button>
    </ng-container>
  </div>

  <div class="page">
    <main>
      <router-outlet />
    </main>
    <footer>
      <div class="logo">
        <span class="logo-mark"><svg class="cactus" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9.2" y="2" width="5.6" height="20" rx="2.8"/><rect x="3.6" y="8" width="3" height="8" rx="1.5"/><rect x="3.6" y="13" width="7" height="3" rx="1.5"/><rect x="17.4" y="5.5" width="3" height="8.5" rx="1.5"/><rect x="13.4" y="11" width="7" height="3" rx="1.5"/></svg></span>
        <strong>CactourShoes<span>.</span></strong>
      </div>
      <span>© 2026 CactourShoes</span>
    </footer>
  </div>
  <div class="toast" *ngIf="shell.notice">{{ shell.notice }}</div>
</div>
